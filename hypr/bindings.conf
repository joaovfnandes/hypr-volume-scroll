# Volume via SUPER+ALT+scroll (classic hyprland.conf syntax).
# SUPER+ALT+scroll is bound to group navigation by default, hence the unbinds.
unbind = SUPER ALT, mouse_up
unbind = SUPER ALT, mouse_down
bind = SUPER ALT, mouse_up, exec, ~/.local/bin/volume-scroll +
bind = SUPER ALT, mouse_down, exec, ~/.local/bin/volume-scroll -
